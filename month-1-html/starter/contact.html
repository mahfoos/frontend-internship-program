<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FATHIMA SAHLA — Contact</title>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Contact me</h1>

    <form action="#" method="post"><div>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>
</div>

<div>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
</div>

<div>
    <label for="phone">Phone Number (Optional):</label>
    <input type="tel" id="phone" name="phone"
           pattern="[0-9]{10}"
           placeholder="0771234567">
</div>

<fieldset>
  <legend>Reason for contact</legend> 
     <div>  
  <input  
    type="radio"  
    id="project"  
    name="reason"  
    value="project"  
    required  
  >  
  <label for="project">Project enquiry</label>  
</div>  

<div>  
  <input  
    type="radio"  
    id="career"  
    name="reason"  
    value="career"  
  >  
  <label for="career">Career opportunity</label>  
</div>  

<div>  
  <input  
    type="radio"  
    id="other"  
    name="reason"  
    value="other"  
  >  
  <label for="other">Other</label>  
</div>
    
</fieldset>

<div>
    <label for="time">Preferred Contact Time:</label>

    <select id="time" name="time">
        <option value="">Select a time</option>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
    </select>
</div>

<div>
    <label for="message">Your Message:</label>

    <textarea id="message" name="message"
              rows="5" minlength="20" required></textarea>
</div>

<button type="submit">Send Message</button>

</form>

    <form action="#" method="post">

    </form>
  </main>

  <footer></footer>
</body>
</html>
